app = "utc-api"
primary_region = "nrt"  # Tokyo (nearest to Taiwan)

[build]
  dockerfile = "../Dockerfile.api"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024
