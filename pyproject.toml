[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utc"
version = "0.1.0"
description = "Urban Turbulence Corridor — 台灣城市風廊圖層系統"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # API 服務（Vercel 部署的最小依賴）
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "python-dotenv>=1.0",
    # 資料庫
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.14",
    "psycopg2-binary>=2.9",
    # 地理空間（API corridor 端點需要）
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    # 數值計算（API 回應需要）
    "numpy>=1.25",
    "pandas>=2.1",
    # 工具
    "pyyaml>=6.0",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
pipeline = [
    # 地理空間進階處理
    "rasterio>=1.3",
    "fiona>=1.9",
    # 都市形態學
    "momepy>=0.7",
    "scipy>=1.11",
    "scikit-image>=0.21",
    # 數值計算進階
    "xarray>=2023.10",
    # 風場模型
    "windrose>=1.9",
    # 快取
    "redis>=5.0",
    # 視覺化與輸出
    "matplotlib>=3.8",
    "folium>=0.15",
    "mapclassify>=2.6",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-html>=4.1",
    "pytest-watch>=4.2",
    "pytest-xdist>=3.5",
    "httpx>=0.26",
    "ruff>=0.1",
    "mypy>=1.7",
    "ipykernel>=6.26",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
